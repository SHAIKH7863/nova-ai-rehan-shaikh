- name: Build web app
  run: npm run build-name: Prepare web assets for Capacitor
  run: |
    mkdir -p dist

    if [ -f dist/index.html ]; then
      echo "dist already contains index.html"
    elif [ -f .output/public/index.html ]; then
      cp -R .output/public/. dist/
    elif [ -f .output/index.html ]; then
      cp -R .output/. dist/
    else
      echo "index.html not found after build"
      find . -name index.html -not -path "./node_modules/*"
      exit 1
    fi

    test -f dist/index.html

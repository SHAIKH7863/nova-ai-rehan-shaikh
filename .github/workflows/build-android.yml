name: Build Nova AI Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        run: npm run build

      - name: Prepare web assets
        run: |
          mkdir -p dist

          if [ -f dist/index.html ]; then
            echo "dist/index.html found"
          elif [ -f .output/public/index.html ]; then
            cp -R .output/public/. dist/
          elif [ -f .output/index.html ]; then
            cp -R .output/. dist/
          else
            echo "index.html not found"
            find . -name index.html -not -path "./node_modules/*"
            exit 1
          fi

          test -f dist/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync app with Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
